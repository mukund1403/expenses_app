app = "hertz-backend"
primary_region = "sin"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  # Hertz expects PORT
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # IMPORTANT: always-on but predictable
  auto_start_machines = true
  min_machines_running = 1

  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
